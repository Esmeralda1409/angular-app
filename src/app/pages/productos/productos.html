<div class="container my-4">
  <h2 class="mb-4 text-primary fw-bold">Tienda Online</h2>

  <!-- Contenedor en cuadrícula (Grid de Bootstrap) -->
  <div class="row row-cols-1 row-cols-md-3 g-4">
    @for (producto of productos(); track producto.id) {
      <div class="col">
        <div class="card h-100 shadow-sm">
          <!-- Imagen del producto -->
          <img 
            [src]="producto.image" 
            class="card-img-top p-3" 
            [alt]="producto.title" 
            style="height: 220px; object-fit: contain;"
          >
          
          <!-- Contenido de la tarjeta -->
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-dark fs-6 fw-bold">{{ producto.title }}</h5>
            <p class="card-text text-muted small mb-2">{{ producto.category }}</p>
            <p class="card-text h5 text-primary fw-bold mb-3">${{ producto.price }}</p>
            
            <!-- Botones al final de la tarjeta -->
            <div class="mt-auto d-flex gap-2">
              <button class="btn btn-secondary btn-sm flex-fill">Ver</button>
              <button class="btn btn-success btn-sm flex-fill">Agregar</button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
