<!-- d-flex coloca los elementos uno al lado del otro en horizontal -->
<section class="d-flex flex-column flex-lg-row align-items-start gap-4 p-4 bg-light min-vh-100">

  <!-- TABLA: con w-100 w-lg-66 o flex-grow-1 para ocupar el espacio izquierdo -->
  <div class="flex-grow-1 w-100">
    <div class="card card-body shadow-sm p-4">
      <h3 class="text-center fw-bold mb-4">Operaciones CRUD</h3>

      <div class="tabla-crud">
        <div class="fila-crud encabezado">
          <div class="celda">Imagen</div>
          <div class="celda">Título</div>
          <div class="celda">Categoría</div>
          <div class="celda">Acciones</div>
        </div>

        @for (p of productos(); track p.id) {
          <div class="fila-crud">
            <div class="celda">
              <img [src]="p.image" [alt]="p.title" class="img-producto" />
            </div>
            <div class="celda fw-semibold">{{ p.title }}</div>
            <div class="celda text-muted">{{ p.category }}</div>
            <div class="celda gap-2">
              <button class="btn btn-danger btn-sm" (click)="borrar(p.id)">Borrar</button>
              <button class="btn btn-primary btn-sm" (click)="actualizar(p)">Actualizar</button>
            </div>
          </div>
        } @empty {
          <p class="text-center text-muted m-3">No hay productos disponibles.</p>
        }
      </div>
    </div>
  </div>

  <!-- FORMULARIO: con un ancho fijo o proporcional usando utilidades flex -->
  <div class="w-100" style="max-width: 400px;">
    <div class="card card-body shadow-sm p-4">
      <h4 class="fw-bold mb-3">
        {{ editingId() === null ? 'Nuevo producto' : 'Editar producto #' + editingId() }}
      </h4>

      <form (ngSubmit)="save()">
        <div class="mb-3">
          <label for="title" class="form-label">Título</label>
          <input id="title" name="title" class="form-control" [(ngModel)]="form.title" required />
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">Precio</label>
          <input id="price" name="price" type="number" min="0" step="0.01" class="form-control" [(ngModel)]="form.price" required />
        </div>

        <div class="mb-3">
          <label for="category" class="form-label">Categoría</label>
          <select id="category" name="category" class="form-select" [(ngModel)]="form.category" required>
            <option value="">Selecciona una categoría</option>
            @for (category of categories(); track category) {
              <option [value]="category">{{ category }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label for="image" class="form-label">URL de la imagen</label>
          <input id="image" name="image" type="url" class="form-control" [(ngModel)]="form.image" required />
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Descripción</label>
          <textarea id="description" name="description" rows="3" class="form-control" [(ngModel)]="form.description"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          {{ editingId() === null ? 'Guardar' : 'Actualizar' }}
        </button>

        @if (editingId() !== null) {
          <button type="button" class="btn btn-outline-secondary w-100 mt-2" (click)="cancel()">Cancelar</button>
        }
      </form>
    </div>
  </div>

</section>
